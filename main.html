<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - 智慧約束暨決策輔助系統</title>
    <link rel="icon" href="AIRDSS.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; }
        .login-bg { 
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); 
        }
    </style>
</head>
<body class="flex items-center justify-center h-screen login-bg">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all hover:scale-[1.01]">
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto mb-4">
                <img src="AIRDSS.png" alt="AIRDSS" class="w-full h-full rounded-full object-cover shadow-lg">
            </div>
            <h1 class="text-2xl font-bold text-slate-800">智慧約束暨決策輔助系統</h1>
            <p class="text-sm text-slate-600 mt-2 font-medium">AIRDSS INTELLIGENT RESTRAINT DECISION SUPPORT</p>

        </div>

        <form onsubmit="handleLogin(event)" class="space-y-6">
            
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">使用者帳號</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i data-lucide="user" class="w-5 h-5"></i>
                    </span>
                    <input type="text" id="username" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="請輸入帳號 (admin)" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">密碼</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-slate-400">
                        <i data-lucide="lock" class="w-5 h-5"></i>
                    </span>
                    <input type="password" id="password" class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition" placeholder="請輸入密碼 (1234)" required>
                </div>
            </div>

            <div id="error-msg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4"></i>
                帳號或密碼錯誤，請重試。
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg transition duration-200 flex justify-center items-center gap-2">
                登入系統 <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>

            <div class="text-center text-xs text-slate-400 mt-4">
                僅供授權之醫護人員使用 | System v1.0
            </div>
        </form>
    </div>

    <script>
        lucide.createIcons();

        function handleLogin(e) {
            e.preventDefault(); // 防止表單直接送出

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-msg');

            // 模擬驗證邏輯
            if (user === 'admin' && pass === '1234') {
                // 1. 儲存登入狀態
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('user', user);

                // 2. 顯示成功動畫 (按鈕變綠)
                const btn = document.querySelector('button[type="submit"]');
                btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
                btn.classList.add('bg-green-600', 'hover:bg-green-700');
                btn.innerHTML = `驗證成功，跳轉中...`;

                // 3. 跳轉頁面
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                // 顯示錯誤
                errorDiv.classList.remove('hidden');
                // 簡單的搖晃動畫
                const card = document.querySelector('.bg-white');
                card.classList.add('animate-pulse');
                setTimeout(() => card.classList.remove('animate-pulse'), 500);
            }
        }
    </script>
</body>
</html>
